name: Deploy Backend to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            APP_NAME="creditdost-staging"
            APP_DIR="/var/www/creditdost-staging/CreditDot-backend"
            APP_PORT="5004"
            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"

            echo "========================================"
            echo "Starting staging backend deployment"
            echo "========================================"

            cd "$APP_DIR"

            echo "Fetching latest code..."
            git fetch origin

            echo "Switching to staging branch..."
            git checkout staging

            echo "Resetting to origin/staging..."
            git reset --hard origin/staging

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "========================================"
            echo "Restarting staging backend"
            echo "========================================"

            pm2 restart "$APP_NAME" --update-env

            echo "========================================"
            echo "Waiting for PM2 process to stabilize"
            echo "========================================"

            PM2_ONLINE=false

            for i in {1..15}; do
              STATUS=$(pm2 jlist | node -e "
                let data = '';
                process.stdin.on('data', c => data += c);
                process.stdin.on('end', () => {
                  try {
                    const apps = JSON.parse(data);
                    const app = apps.find(a => a.name === '${APP_NAME}');
                    console.log(app ? app.pm2_env.status : 'missing');
                  } catch (e) {
                    console.log('unknown');
                  }
                });
              ")

              echo "PM2 status: $STATUS (attempt $i/15)"

              if [ "$STATUS" = "online" ]; then
                PM2_ONLINE=true
                break
              fi

              sleep 2
            done

            if [ "$PM2_ONLINE" != "true" ]; then
              echo "ERROR: PM2 process did not become online."

              echo "PM2 status:"
              pm2 status

              echo "Recent staging backend logs:"
              pm2 logs "$APP_NAME" --lines 50 --nostream || true

              exit 1
            fi

            echo "PM2 process is online."

            echo "========================================"
            echo "Waiting for application on port ${APP_PORT}"
            echo "========================================"

            HEALTHY=false

            for i in {1..15}; do
              if curl --connect-timeout 2 --max-time 5 -fsS "$HEALTH_URL" > /dev/null; then
                echo "Staging backend is healthy on port ${APP_PORT}."
                HEALTHY=true
                break
              fi

              echo "Health check failed (attempt $i/15)."

              if [ "$i" -lt 15 ]; then
                sleep 2
              fi
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "========================================"
              echo "ERROR: Staging backend health check failed"
              echo "========================================"

              echo "Health URL: $HEALTH_URL"

              echo "Listening ports:"
              ss -ltnp || true

              echo "PM2 status:"
              pm2 status

              echo "Recent staging backend logs:"
              pm2 logs "$APP_NAME" --lines 50 --nostream || true

              exit 1
            fi

            echo "========================================"
            echo "Final health check"
            echo "========================================"

            curl --connect-timeout 2 --max-time 5 -fsS "$HEALTH_URL" > /dev/null

            echo "Final health check passed."

            echo "========================================"
            echo "Final PM2 status"
            echo "========================================"

            pm2 status

            echo "========================================"
            echo "Staging backend deployment successful"
            echo "========================================"